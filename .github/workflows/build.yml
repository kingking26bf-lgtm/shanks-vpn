      - name: Télécharger l’APK
        uses: actions/upload-artifact@v4
        with:
          name: SHANKS-TUNNING-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: warn

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          mkdir project
          unzip -q shanks-tunning-android.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l’APK
        run: |
          WRAPPER=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper introuvable"
            exit 1
          fi
          chmod +x "$WRAPPER"
          cd "$(dirname "$WRAPPER")"
          ./gradlew assembleDebug

      - name: Télécharger l’APK
        uses: actions/upload-artifact@v4
        with:
          name: SHANKS-TUNNING-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error