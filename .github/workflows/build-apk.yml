name: Construire SHANKS VPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'interface
        run: npm run build

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Vérifier l'APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SHANKS-VPN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
